# Ships the game on every push to main: tests, then
# - the web build to Cloudflare Pages (https://dandori-academy.pages.dev),
# - the leaderboard server to Cloudflare Workers (worker/),
# - the web build and the Windows and Linux desktop builds to itch.io.
#
# Repository secrets (Settings, Secrets and variables, Actions):
#   CLOUDFLARE_API_TOKEN  a Cloudflare API token with Workers, D1 and Pages edit rights
#   BUTLER_API_KEY        an itch.io API key (itch.io, Settings, API keys)
# A step whose secret is missing is skipped.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 05c753f6ea41e64e152ebf7d6be2cbd1
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Leaderboard server (Cloudflare Workers)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler d1 migrations apply dandori-board --remote --config worker/wrangler.toml
          npx wrangler deploy --config worker/wrangler.toml

      - name: Web build (Cloudflare Pages)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy --branch main --commit-hash "$GITHUB_SHA"

      - name: Desktop builds
        if: env.BUTLER_API_KEY != ''
        run: |
          sudo apt-get install -y zip >/dev/null
          node scripts/build-desktop.mjs win32 linux

      - name: itch.io
        if: env.BUTLER_API_KEY != ''
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          BUTLER=./butler/butler node scripts/push-itch.mjs web win32 linux

      - name: Desktop zips as a workflow artifact
        if: env.BUTLER_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: release/*.zip
          retention-days: 14
